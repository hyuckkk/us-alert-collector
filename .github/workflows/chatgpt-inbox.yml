name: chatgpt-inbox
# ChatGPT's connected GitHub app can create files but cannot POST repository_dispatch.
# Each new official event candidate file triggers the existing U.S. external_ingest pipeline.
# Never use the Korean Telegram relay.
on:
  push:
    branches: [main]
    paths:
      - "external-inbox/chatgpt/*.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chatgpt-inbox
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find submitted JSON files
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/inbox-paths.txt"
          import os, re, subprocess
          from pathlib import Path
          changed = subprocess.check_output(
              ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", os.environ["GITHUB_SHA"]],
              text=True
          )
          for p in changed.splitlines():
              if re.fullmatch(r"external-inbox/chatgpt/[a-zA-Z0-9_-]+\.json", p) and Path(p).is_file():
                  print(p)
          PY
          if [ ! -s "$RUNNER_TEMP/inbox-paths.txt" ]; then
            echo "::notice title=chatgpt-inbox::No new matching input in latest commit; nothing to ingest."
          fi
      - name: Install parser dependencies
        if: ${{ hashFiles('external-inbox/chatgpt/*.json') != '' }}
        run: pip install -r collector/requirements.txt
      - name: Connect to existing Colorado Worker
        if: ${{ hashFiles('external-inbox/chatgpt/*.json') != '' }}
        run: |
          bash scripts/cf_env.sh
          set -a; . "$GITHUB_ENV"; set +a
          bash scripts/worker_ready.sh
      - name: Verify and ingest into U.S. delivery system
        if: env.READY == '1'
        run: |
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            python3 collector/external_ingest.py --payload-file "$file"
          done < "$RUNNER_TEMP/inbox-paths.txt"
      - name: Dispatch verified Colorado alerts
        if: env.READY == '1'
        run: |
          bash scripts/admin_call.sh dispatch
          bash scripts/admin_call.sh digest
