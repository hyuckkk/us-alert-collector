name: probe-sources
# 정보원 시험 조회. 결과를 reports/probe.json 으로 커밋한다(같은 브랜치). 텔레그램·Worker 에는 아무것도 보내지 않는다.
# 매주 월요일에는 매일 수집에서 빠진(retest) 정보원까지 다시 시험한다.
on:
  schedule:
    - cron: "10 14 * * 1"
  push:
    paths: ["config/sources.json", "collector/probe.py", "collector/fetch.py", ".github/workflows/probe-sources.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    # 강제 push(이력 재작성 등)는 GitHub 가 '모든 파일 변경'으로 보아 경로 조건이 다 걸린다 → 실행하지 않음(2026-10-21 사고 재발 방지)
    if: github.event_name != 'push' || !github.event.forced
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt
      - name: Probe
        env:
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: python collector/probe.py
      - name: Commit report
        run: |
          git config user.name "us-alert-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/probe.json
          git commit -m "probe report [skip ci]" || exit 0
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"
