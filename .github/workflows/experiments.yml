name: experiments
# 개발 브랜치 전용 시험. Worker·텔레그램에는 아무것도 쓰지 않는다. 결과는 같은 브랜치에 커밋(공개 웹 정보만).
#  ticks/compare   push → AI 발굴 모델 비교(Opus vs Sonnet, 같은 주제)          — 유료(1회 약 $2)
#  ticks/reference push → 기준 목록 후보(공식 게시판 패널, AI 없음)               — 무료
#  ticks/groundtruth push → 기준 목록 원문 문장 수집 + 감시 정보원 목록 대조(AI 없음) — 무료
#  ticks/coverage    push → 정보원 보강 전후 수집 범위 + 키워드 검색 대조(AI 없음)     — 무료
#  ticks/fullsystem  push → 전체 수집 성능(정보원·검색·AI 발굴·AI 추출·판정, 건식) + 기준 행사별 단계 평가 — 유료(상한 usd_cap 기본 $5, 승인 후에만)
on:
  push:
    branches-ignore: [main]
    paths: ["ticks/compare", "ticks/reference", "ticks/groundtruth", "ticks/coverage", "ticks/fullsystem", "ticks/independent", "ticks/sourceprobe"]
permissions:
  contents: write
concurrency:
  group: experiments-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    # 강제 push(이력 재작성 등)는 GitHub 가 '모든 파일 변경'으로 보아 경로 조건이 다 걸린다 → 실행하지 않음(2026-10-21 사고 재발 방지)
    if: github.event_name != 'push' || !github.event.forced
    runs-on: ubuntu-latest
    timeout-minutes: 65          # 전체 시험 예상 35–45분 + 결과 저장. 실패해도 자동 재실행하지 않는다(재시도 설정 없음)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt
      - name: Which experiment
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD -- ticks/ || true)
          echo "COMPARE=$(echo "$changed" | grep -q ticks/compare && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "REFERENCE=$(echo "$changed" | grep -q ticks/reference && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "GROUNDTRUTH=$(echo "$changed" | grep -q ticks/groundtruth && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "INDEPENDENT=$(echo "$changed" | grep -q ticks/independent && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "SOURCEPROBE=$(echo "$changed" | grep -q ticks/sourceprobe && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "COVERAGE=$(echo "$changed" | grep -q ticks/coverage && echo 1 || echo 0)" >> "$GITHUB_ENV"
          echo "FULLSYSTEM=$(echo "$changed" | grep -q ticks/fullsystem && echo 1 || echo 0)" >> "$GITHUB_ENV"
      - name: Model comparison
        if: env.COMPARE == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODELS=$(grep -oE '^models=[a-z0-9,.-]+' ticks/compare | cut -d= -f2)
          OUT=reports/model-compare.json; [ -n "$MODELS" ] && OUT="reports/model-compare-$(echo $MODELS | tr ',' '_').json"
          python collector/compare_discover.py ${MODELS:+--models $MODELS} --out "$OUT"
      - name: Reference candidates
        if: env.REFERENCE == '1'
        run: python collector/reference_snapshot.py
      - name: Ground truth page facts
        if: env.GROUNDTRUTH == '1'
        run: python collector/verify_ground_truth.py
      - name: Independent sample candidates (no AI)
        if: env.INDEPENDENT == '1'
        run: python collector/verify_ground_truth.py --panel eval/independent_panel.json --out eval/independent_pages.json
      - name: Source candidates + AI input check (no AI)
        if: env.SOURCEPROBE == '1'
        run: |
          F=$(grep -oE '^file=[A-Za-z0-9_./-]+' ticks/sourceprobe | cut -d= -f2)
          if [ -n "$F" ]; then python collector/probe_candidates.py "$F" "${F%.json}_result.json"; else python collector/probe_candidates.py; fi
          python collector/preview_inputs.py
      - name: Coverage before/after new sources
        if: env.COVERAGE == '1'
        run: python collector/coverage.py
      - name: Full-system dry run with stage trace (paid AI — approved runs only)
        if: env.FULLSYSTEM == '1'
        timeout-minutes: 58      # 시험 단계가 늦어져도 결과 저장 단계가 돌 시간을 남긴다
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOUSEHOLD_PROFILE: ${{ secrets.HOUSEHOLD_PROFILE }}
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
          FAMILY_AVAILABLE_FROM: ${{ secrets.FAMILY_AVAILABLE_FROM }}
        run: |
          # --dry-run: Worker·텔레그램에 쓰지 않음. 비용은 --usd-cap 이 막는다(각 AI 호출 전 '지금까지 + 그 호출의 최악 비용'이 상한을 넘으면 호출 안 함).
          # --max 는 처리 건수 상한일 뿐 비용 상한이 아니다.
          MAX=$(grep -oE '^max=[0-9]+' ticks/fullsystem | cut -d= -f2); MAX=${MAX:-2500}
          WANT=$(grep -oE '^usd_cap=[0-9.]+' ticks/fullsystem | cut -d= -f2); WANT=${WANT:-5}
          # 개발 예산(총 $40, 1회 $5): 기록된 누적 사용액으로 남은 돈을 계산해 이번 상한을 정한다. 부족하면 실행하지 않음
          python3 scripts/dev_budget.py check --cap "$WANT" | tee budget.txt
          CAP=$(grep -oE '^CAP=[0-9.]+' budget.txt | cut -d= -f2); [ -n "$CAP" ] || exit 1
          echo "CAP=$CAP" >> "$GITHUB_ENV"; echo "FULLSYSTEM_STARTED=1" >> "$GITHUB_ENV"
          export USAGE_LIVE_FILE=reports/usage-live.json PROGRESS_FILE=reports/fullsystem-progress.jsonl
          python collector/run.py --mode full --dry-run --all-sources --max "$MAX" --usd-cap "$CAP" --out reports/fullsystem-run.json --trace reports/fullsystem-trace.json
          python3 -c "import json;m=json.load(open('reports/fullsystem-run.json'))['metrics'];print('::notice title=fullsystem cost::usd=%s cap=$CAP calls=%s searches=%s' % (m.get('usd'), m.get('calls'), m.get('searches')))"
          python collector/eval_stages.py reports/fullsystem-trace.json --out eval/stages.json ${FAMILY_AVAILABLE_FROM:+--owner-from "$FAMILY_AVAILABLE_FROM"}
          python3 -c "import json;print('::notice title=fullsystem result::'+json.dumps(json.load(open('eval/stages.json'))['summary'],ensure_ascii=False))"
      - name: Record dev AI spend (always, incl. failed/cancelled runs)
        if: always() && env.FULLSYSTEM_STARTED == '1'
        run: python3 scripts/dev_budget.py record --run "$GITHUB_RUN_ID" --kind fullsystem --cap "$CAP" --usage reports/usage-live.json --status "${{ job.status }}"
      - name: Commit results
        if: always()
        run: |
          git config user.name "us-alert-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in reports/model-compare*.json eval/reference_candidates.json eval/ground_truth_pages.json eval/coverage.json eval/independent_pages.json eval/source_candidates_result.json eval/source_candidates2_result.json eval/ai_inputs.json eval/stages.json eval/dev_ai_spend.jsonl reports/fullsystem-run.json reports/fullsystem-trace.json reports/fullsystem-progress.jsonl; do [ -e "$f" ] && git add "$f"; done
          git commit -q -m "experiment results [skip ci]" || exit 0
          git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
