name: deploy-worker
# worker/ 가 바뀌면 us-alert-worker 를 배포한다. D1(us-alert-db)은 없으면 만들고 스키마를 적용한다.
# 봇 토큰·소유자 ID 는 GitHub 비밀값에서 Worker 비밀값으로 복사한다(비어 있는 값은 건너뜀).
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-worker
  cancel-in-progress: false
jobs:
  # 배포 전 필수 조건: 개인정보 검사 엄격 모드(검사어 설정 + 현재 파일·과거 이력 모두 통과). 실패하면 배포하지 않는다.
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
      - env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: python3 scripts/privacy_gate.py strict
  deploy:
    needs: privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - name: Find Cloudflare account and Worker URL
        run: bash ../scripts/cf_env.sh
      - name: Ensure D1 database us-alert-db
        run: |
          find_id() { npx wrangler d1 list --json | python3 -c "import json,sys;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='us-alert-db'),''))"; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create us-alert-db; ID=$(find_id); fi
          [ -n "$ID" ] || { echo "D1 lookup failed"; exit 1; }
          sed -i "s/__D1_DATABASE_ID__/$ID/" wrangler.toml
      - name: Apply D1 migrations
        run: bash ../scripts/run.sh npx wrangler d1 migrations apply us-alert-db --remote
      - name: Deploy
        run: bash ../scripts/run.sh npx wrangler deploy
      - name: Sync Worker secrets from GitHub
        env:
          BOT_TOKEN_LIFE: ${{ secrets.BOT_TOKEN_LIFE }}
          BOT_TOKEN_FAMILY: ${{ secrets.BOT_TOKEN_FAMILY }}
          BOT_TOKEN_KIDS: ${{ secrets.BOT_TOKEN_KIDS }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          FAMILY_AVAILABLE_FROM: ${{ secrets.FAMILY_AVAILABLE_FROM }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          umask 077
          python3 - > "$RUNNER_TEMP/secrets.json" <<'PY'
          import json, os
          keys = ["BOT_TOKEN_LIFE", "BOT_TOKEN_FAMILY", "BOT_TOKEN_KIDS", "OWNER_CHAT_ID", "FAMILY_AVAILABLE_FROM", "GH_DISPATCH_TOKEN"]
          out = {k: os.environ[k] for k in keys if os.environ.get(k)}
          out["ADMIN_KEY"] = os.environ["US_ADMIN_KEY"]
          print(json.dumps(out))
          PY
          python3 -c "import json,os;print('syncing:', ', '.join(json.load(open(os.environ['RUNNER_TEMP']+'/secrets.json'))))"
          rc=0; bash ../scripts/run.sh npx wrangler secret bulk "$RUNNER_TEMP/secrets.json" || rc=$?
          rm -f "$RUNNER_TEMP/secrets.json"; exit $rc
      - name: Register Telegram webhooks
        run: |
          bash ../scripts/run.sh bash ../scripts/admin_call.sh setup || echo "::warning::webhook setup incomplete - add BOT_TOKEN_* secrets in GitHub and re-run deploy-worker, then run the 'admin' workflow with action=setup"

      - name: Verify public sports calendar routes
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 1 --max-time 15 "$US_WORKER_URL/sports" | grep -q '<title>Colorado'
          curl -fsS --retry 3 --retry-delay 1 --max-time 20 "$US_WORKER_URL/sports/events?month=2026-10" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and isinstance(d.get("events"),list); print("sports API OK, records:",len(d["events"]),"inspected:",d.get("inspected"))'
