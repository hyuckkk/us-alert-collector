name: dispatch
# 매시: 미뤄진 즉시 알림·재시도 발송, 일간 요약(각자 현지 시각), 월요일 주간 보고,
# 그리고 매일 수집 감시 — 성공 기록이 26시간 넘게 없으면 collect(full)를 다시 실행한다(1차 검증 5).
# GitHub Actions 가 통째로 멈추면 이 감시도 멈추므로, Worker 는 소유자가 봇을 쓸 때마다 같은 검사를 따로 한다.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # 감시가 collect 를 다시 실행할 때 필요(같은 저장소 안에서만)
concurrency:
  group: dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash scripts/cf_env.sh
          set -a; . "$GITHUB_ENV"; set +a
          bash scripts/worker_ready.sh
      - if: env.READY == '1'
        run: bash scripts/run.sh bash scripts/admin_call.sh dispatch
      - if: env.READY == '1'
        run: bash scripts/run.sh bash scripts/admin_call.sh digest
      - name: Weekly report (Monday 15:20 UTC)
        if: github.event_name == 'schedule' && env.READY == '1'
        run: |
          if [ "$(date -u +%u%H)" = "115" ]; then bash scripts/run.sh bash scripts/admin_call.sh report; fi
      - name: Collect watchdog
        if: env.READY == '1'
        run: |
          bash scripts/admin_call.sh watchdog || true
          stale=$(python3 -c "import json;print(json.load(open('out.json')).get('stale'))")
          running=$(gh run list --workflow collect.yml --status in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
          if [ "$stale" = "True" ] && [ "$running" = "0" ]; then
            echo "::warning::collect stale — re-running collect (full)"
            gh workflow run collect.yml -f mode=full -f dry_run=false
          fi
      - name: Light collect gap watchdog
        # GitHub 예약 실행은 1~3시간 밀리거나 통째로 빠진다(collect 가 cron 하루 6회 중 3~4회만 돎, 실패·취소는 0건).
        # main 의 collect 가 5시간 넘게 시작되지 않았고 진행·대기 중인 것도 없으면 light 를 한 번 대신 실행한다.
        if: github.event_name == 'schedule' && env.READY == '1'
        run: |
          runs=$(gh run list --workflow collect.yml --branch main --limit 5 --json createdAt,status 2>/dev/null) || exit 0
          active=$(echo "$runs" | python3 -c "import json,sys;print(sum(r['status']!='completed' for r in json.load(sys.stdin)))")
          last=$(echo "$runs" | python3 -c "import json,sys;r=json.load(sys.stdin);print(r[0]['createdAt'] if r else '')")
          [ -n "$last" ] && [ "$active" = "0" ] || exit 0
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          if [ "$age" -gt 18000 ]; then
            echo "::warning::collect 마지막 시작 ${age}s 전 — light 대신 실행"
            gh workflow run collect.yml --ref main -f mode=light -f dry_run=false
          fi
