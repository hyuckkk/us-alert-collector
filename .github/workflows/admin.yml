name: admin
# 0단계 점검용 수동 실행: 테스트 발송, 버튼 기록 조회, 상태, 웹훅 재등록.
# Actions 탭 → admin → Run workflow 에서 action 을 고른다.
# ticks/admin 파일에 action 이름을 써서 push 해도 실행된다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "실행할 작업"
        type: choice
        options: [test-send, dump-life, dump-family, dump-kids, preview-life, preview-family, preview-kids, clicks, status, usage, heartbeat, setup, run-cron, dispatch, digest, report, baseline, baseline-start, baseline-stop]
        default: test-send
  push:
    branches: [main]
    paths: ["ticks/admin"]
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/cf_env.sh
      - name: Run
        run: |
          ACTION="${{ inputs.action }}"
          [ -n "$ACTION" ] || ACTION=$(head -n1 ticks/admin | tr -d '[:space:]')
          bash scripts/admin_call.sh "$ACTION"
