name: admin
# 0단계 점검용 수동 실행: 테스트 발송, 버튼 기록 조회, 상태, 웹훅 재등록.
# Actions 탭 → admin → Run workflow 에서 action 을 고른다.
# ticks/admin 파일에 action 이름을 써서 push 해도 실행된다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "실행할 작업"
        type: choice
        options: [test-send, outbox-skip, dump-life, dump-family, dump-kids, preview-life, preview-family, preview-kids, compare, workload, export, catchup-dry, catchup, clicks, status, usage, heartbeat, setup, run-cron, dispatch, digest, report, baseline, baseline-start, baseline-stop]
        default: test-send
      key:
        description: "outbox-skip: 행사 키(e…)"
        required: false
      version:
        description: "outbox-skip: 판 번호(비우면 아직 안 보낸 모든 판)"
        required: false
  push:
    branches: [main]
    paths: ["ticks/admin"]
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/cf_env.sh
      - name: Run
        env:
          SKIP_KEY: ${{ inputs.key }}
          SKIP_VERSION: ${{ inputs.version }}
        run: |
          ACTION="${{ inputs.action }}"
          [ -n "$ACTION" ] || ACTION=$(head -n1 ticks/admin | tr -d '[:space:]')
          echo "ACTION=$ACTION" >> "$GITHUB_ENV"
          if [ "$ACTION" = "export" ]; then
            code=$(curl -sS -o "$RUNNER_TEMP/export.json" -w "%{http_code}" -H "Authorization: Bearer $US_ADMIN_KEY" "$US_WORKER_URL/admin/export?since=2026-10-01")
            if [ "${code:0:1}" != "2" ]; then
              echo "::error title=export::HTTP $code $(head -c 1500 "$RUNNER_TEMP/export.json" | tr '\n' ' ' | sed "s#$US_WORKER_URL#<worker>#g")"; exit 1
            fi
            python3 scripts/export_eval.py --from-json "$RUNNER_TEMP/export.json" --out "$RUNNER_TEMP/issue20" 2>&1 | tail -5 | sed 's/^/::notice title=export::/'
            test -s "$RUNNER_TEMP/issue20/summary.md"
            cat "$RUNNER_TEMP/issue20/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            bash scripts/admin_call.sh "$ACTION"
          fi
      - name: Export files
        if: env.ACTION == 'export'
        uses: actions/upload-artifact@v4
        with:
          name: issue20-export
          path: ${{ runner.temp }}/issue20
          retention-days: 90
