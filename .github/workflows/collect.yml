name: collect
# full(매일 1회): 정보원 감시 + 키워드 검색 + AI 발굴 + 상세 재검사 + 대기열 처리 + 발송
# light(4시간마다): 상세 재검사 + 대기열 처리 + 발송 — 마감 임박 항목과 상한을 넘은 항목을 빨리 처리
# 예약 실행은 main 에서만 돈다. 두 방식은 같은 concurrency 그룹이라 동시에 돌지 않는다(대기열 중복 처리 방지).
# 다른 브랜치에서 ticks/collect-dry 를 push 하면 시험 실행(--dry-run): Worker·텔레그램에 아무것도 쓰지 않고 결과를 아티팩트로만 남긴다.
on:
  schedule:
    - cron: "30 12 * * *"            # full: 06:30 덴버(서머타임) / 21:30 한국
    # light: full(12:30) 앞뒤까지 실제 4시간 간격 — 00:40, 04:40, 08:40, [12:30 full], 16:40, 20:40 UTC (3차 검증 3: 이전 10:40→16:40 6시간 공백 수정)
    - cron: "40 0,4,8,16,20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "시험 실행(Worker 에 쓰지 않음)"
        type: boolean
        default: true
      max:
        description: "AI 로 넘길 최대 건수(비우면 설정값)"
        required: false
      mode:
        description: "full | light"
        type: choice
        options: [full, light]
        default: full
  push:
    branches-ignore: [main]
    paths: ["ticks/collect-dry"]
permissions:
  contents: write   # 브랜치 시험 실행 결과(reports/dry-run.json, 공개 정보만)를 커밋
concurrency:
  group: collect-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    # 강제 push(이력 재작성 등)는 GitHub 가 '모든 파일 변경'으로 보아 경로 조건이 다 걸린다 → 실행하지 않음(2026-10-21 사고 재발 방지)
    if: github.event_name != 'push' || !github.event.forced
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      HOUSEHOLD_PROFILE: ${{ secrets.HOUSEHOLD_PROFILE }}
      NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt
      - name: Decide mode
        run: |
          DRY=true
          if [ "${{ github.event_name }}" = "schedule" ]; then DRY=false; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "false" ] && [ "${{ github.ref_name }}" = "main" ]; then DRY=false; fi
          echo "DRY=$DRY" >> "$GITHUB_ENV"
          MAX="${{ inputs.max }}"; [ -z "$MAX" ] && [ -f ticks/collect-dry ] && [ "${{ github.event_name }}" = "push" ] && MAX=$(grep -oE '^max=[0-9]+' ticks/collect-dry | cut -d= -f2)
          echo "MAX=$MAX" >> "$GITHUB_ENV"
          MODE=full
          # 예약 실행 중 full 이 아닌 것은 모두 light(예약 문자열을 바꿔도 판정이 어긋나지 않게)
          [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "30 12 * * *" ] && MODE=light
          [ -n "${{ inputs.mode }}" ] && MODE="${{ inputs.mode }}"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "mode: dry=$DRY max=${MAX:-config}"
      - name: Worker address
        if: env.DRY == 'false'
        run: |
          bash scripts/cf_env.sh
          set -a; . "$GITHUB_ENV"; set +a
          bash scripts/worker_ready.sh
      - name: Collect
        if: env.DRY == 'true' || env.READY == '1'
        run: |
          args="--mode $MODE --out reports/run.json"
          [ "$DRY" = "true" ] && args="$args --dry-run"
          [ -n "$MAX" ] && args="$args --max $MAX"
          python collector/run.py $args
      - name: Run summary (counts only)
        if: always() && (env.DRY == 'true' || env.READY == '1')
        run: |
          [ -f reports/run.json ] || exit 0
          python3 - <<'PY'
          import json
          r = json.load(open("reports/run.json")); m = r.get("metrics", {})
          keys = ("usd", "calls", "sources_ok", "sources_total", "entries_fetched", "entries_new", "ai_items", "ai_failed", "events_out", "outbox", "queue_queued", "watch_checked", "watch_changed")
          s = {k: m.get(k) for k in keys}
          s["dropped"] = r.get("dropped"); s["stages_usd"] = {k: v.get("usd") for k, v in (r.get("stages") or {}).items() if v.get("usd")}
          s["alerts"] = [a[:120] for a in (r.get("alerts") or [])][:6]
          print("::notice title=collect summary::" + json.dumps(s, ensure_ascii=False, separators=(",", ":"))[:3800])
          PY
      - name: Commit dry-run report (branch only)
        if: always() && env.DRY == 'true' && github.ref_name != 'main'
        run: |
          [ -f reports/run.json ] || exit 0
          cp reports/run.json reports/dry-run.json
          git config user.name "us-alert-collector[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/dry-run.json && git commit -q -m "dry-run report [skip ci]" || exit 0
          git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-report
          path: reports/run.json
          retention-days: 30
