name: queue-diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/queue-diagnostics.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/cf_env.sh
      - name: Read stuck queue diagnostics (no mutations)
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, collections, re
          base = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          def api(path, data=None):
              req = urllib.request.Request(base + path, data=json.dumps(data).encode() if data else None, headers={"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"], "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  result = json.load(response)
              if not result.get("success"): raise RuntimeError("Cloudflare query failed")
              return result["result"]
          dbs = api("/d1/database?per_page=100")
          ids = [d["uuid"] for d in dbs if d["name"] == "us-alert-db"]
          assert len(ids) == 1
          result = api("/d1/database/" + ids[0] + "/query", {"sql": "SELECT url, last_error, length(json_extract(body,'$.text')) AS text_chars FROM pending WHERE status='stuck' LIMIT 2000", "params": []})
          rows = result[0]["results"]
          counts = collections.Counter()
          for row in rows:
              host = urllib.parse.urlsplit(row["url"]).hostname or "unknown"
              match = re.search(r"HTTP [0-9]{3}|[A-Za-z]+Error|TimeoutException", row.get("last_error") or "")
              error = match.group(0) if match else "unclassified"
              counts[(host,error)] += 1
          samples = []
          for host,error in counts:
              candidates = [r for r in rows if urllib.parse.urlsplit(r["url"]).hostname == host and ((re.search(r"HTTP [0-9]{3}|[A-Za-z]+Error|TimeoutException", r.get("last_error") or "").group(0) if re.search(r"HTTP [0-9]{3}|[A-Za-z]+Error|TimeoutException", r.get("last_error") or "") else "unclassified") == error)]
              samples.extend({"host": host, "path": urllib.parse.urlsplit(r["url"]).path, "error": error} for r in candidates[:3])
          print(json.dumps({"samples": samples}))
          print(json.dumps({"total": len(rows), "by_host_error": [{"host": h, "error": e, "count": n} for (h,e),n in counts.most_common()], "with_body_400_chars": sum((r["text_chars"] or 0)>=400 for r in rows)}, ensure_ascii=False))
          PY
