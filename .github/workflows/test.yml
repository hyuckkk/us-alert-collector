name: test
# 모든 push 에서 수집기(pytest)와 Worker(로컬 D1 + 가짜 텔레그램 종단 검사)를 돌린다. 외부로는 아무것도 보내지 않는다.
on:
  push:
    paths-ignore: ["ticks/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch all branches (history scan)
        run: git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
      # 검사어(PRIVACY_TERMS)가 비어 있으면 '불완전'으로 실패한다. 검사어는 로그에 출력하지 않는다.
      - name: Secret / personal data scan (current files)
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: python3 scripts/privacy_scan.py
      - name: Secret / personal data scan (all commits, all branches)
        if: always()
        env:
          PRIVACY_TERMS: ${{ secrets.PRIVACY_TERMS }}
        run: python3 scripts/privacy_scan.py --history
  collector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r collector/requirements.txt pytest==8.3.4
      - run: python -m pytest -q collector/tests
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --no-fund
      - run: npm test
