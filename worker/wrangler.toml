# us-alert-worker — 미국 체류 알림 시스템 (한국 telegram-relay Worker 와 완전히 별개)
name = "us-alert-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Cloudflare 무료 요금제는 계정당 예약 실행 5개까지이고 한국 Worker 가 5개를 모두 쓴다.
# 그래서 매일 점검(만료일 알림, 웹훅 점검)은 GitHub Actions key-check 가 /admin/run-cron 으로 부른다.
# Workers Paid 로 바꾸면 crons = ["5 0 * * *"] 로 되돌릴 수 있다.
[triggers]
crons = []

[vars]
TG_API = "https://api.telegram.org"
SYSTEM_BOT = "life"        # 시스템 알림(만료·키 점검)을 보낼 봇
OWNER_TZ = "Asia/Seoul"    # 소유자 기준 날짜·시각. 입국 후 "America/Denver" 로 변경
# 소유자(가족)의 참가 가능 시작일은 개인 일정이라 여기 두지 않는다 → GitHub 비밀값 FAMILY_AVAILABLE_FROM 을 배포 때 복사. 봇에서 /from 으로도 설정
GH_REPO = "hyuckkk/us-alert-collector"   # 수집이 늦을 때 매시 감시가 수집 실행을 요청할 저장소(토큰은 비밀값 GH_DISPATCH_TOKEN)
DELIVERY_MODE = "all"                  # 승인된 지인과 소유자에게 발송. /start 신규 신청은 소유자 /approve 이후 활성화

[[d1_databases]]
binding = "DB"
database_name = "us-alert-db"
# 배포 워크플로가 이름으로 찾아 채운다(없으면 만든다). 직접 배포할 때는 `npx wrangler d1 list` 의 ID 로 바꾼다.
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[observability]
enabled = true

# GitHub 예약 실행과 독립된 매시 실행(발송·요약·수집 지연 감시). Cloudflare 예약 실행(cron) 슬롯을 쓰지 않는 Durable Object 알람.
[[durable_objects.bindings]]
name = "HEARTBEAT"
class_name = "Heartbeat"

[[migrations]]
tag = "v1-heartbeat"
new_sqlite_classes = ["Heartbeat"]
